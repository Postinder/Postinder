version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postinder-db
    environment:
      POSTGRES_USER: postinder_user
      POSTGRES_PASSWORD: postinder_pass
      POSTGRES_DB: postinder_db
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postinder_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
